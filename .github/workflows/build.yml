name: Node.js CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do codigo
      uses: actions/checkout@v7.0.1

    - name: Configurar Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version: "20.x"
        cache: npm
        cache-dependency-path: api/package-lock.json

    - name: Configurar Python para Semgrep
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Instalar Semgrep
      run: python -m pip install --disable-pip-version-check --only-binary=":all:" semgrep==1.186.0

    - name: Detectar vulnerabilidades estaticas
      run: semgrep scan --config p/security-audit --config p/secrets --config .semgrep.yml --severity ERROR --error .

    - name: Testar autenticacao legada
      run: python -m unittest discover -s F1_project/tests

    - name: Instalar dependencias
      working-directory: api
      run: npm ci

    - name: Gerar diagrama UML de classes
      working-directory: api
      run: npm run diagram

    - name: Publicar imagem do diagrama
      uses: actions/upload-artifact@v4
      with:
        name: diagrama-uml
        path: docs/diagrams/domain-classes.svg
        if-no-files-found: error

    - name: Verificar atualizacoes de dependencias
      working-directory: api
      run: npm run deps:check

    - name: Verificar padrao JavaScript com ESLint
      working-directory: api
      run: npm run lint

    - name: Detectar code smells com SonarJS
      working-directory: api
      run: npm run code-smells

    - name: Detectar codigo duplicado com jscpd
      working-directory: api
      run: npm run duplicates

    - name: Executar testes
      working-directory: api
      run: npm test
