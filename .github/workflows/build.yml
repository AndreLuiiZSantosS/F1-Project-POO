name: Node.js CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do codigo
      uses: actions/checkout@v7.0.1

    - name: Configurar Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version: "20.x"
        cache: npm
        cache-dependency-path: api/package-lock.json

    - name: Instalar dependencias
      working-directory: api
      run: npm ci

    - name: Gerar diagrama UML de classes
      working-directory: api
      run: npm run diagram

    - name: Publicar imagem do diagrama
      uses: actions/upload-artifact@v4
      with:
        name: diagrama-uml
        path: docs/diagrams/domain-classes.svg
        if-no-files-found: error

    - name: Verificar atualizacoes de dependencias
      working-directory: api
      run: npm run deps:check

    - name: Verificar padrao JavaScript com ESLint
      working-directory: api
      run: npm run lint

    - name: Detectar code smells com SonarJS
      working-directory: api
      run: npm run code-smells

    - name: Detectar codigo duplicado com jscpd
      working-directory: api
      run: npm run duplicates

    - name: Executar testes
      working-directory: api
      run: npm test

